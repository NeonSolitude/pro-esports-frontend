<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Esports Typing Arena</title>
    <style>
        :root {
            --bg-color: #0a0a12;
            --panel-bg: #121225;
            --neon-cyan: #00f2fe;
            --neon-pink: #fe019a;
            --text-color: #e0e0ff;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-top: 20px;
        }

        h1 {
            font-size: 2.5rem;
            color: #fff;
            text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-cyan);
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .subtitle {
            color: var(--neon-pink);
            text-shadow: 0 0 5px var(--neon-pink);
            font-weight: bold;
            font-size: 1rem;
        }

        .container {
            width: 90%;
            max-width: 800px;
            background: var(--panel-bg);
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.2);
            border-radius: 12px;
            padding: 25px;
            margin-top: 30px;
            box-sizing: border-box;
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.4);
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid var(--neon-pink);
        }

        .stat-box {
            text-align: center;
        }

        .stat-val {
            font-size: 1.8rem;
            font-weight: bold;
            color: #fff;
        }

        .stat-lbl {
            font-size: 0.8rem;
            color: #8888aa;
            text-transform: uppercase;
        }

        .word-display {
            font-size: 1.5rem;
            line-height: 2rem;
            background: #05050a;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            min-height: 80px;
            letter-spacing: 1px;
            border: 1px solid #222244;
        }

        .current-word {
            color: var(--neon-cyan);
            font-weight: bold;
            text-decoration: underline;
        }

        .input-area {
            width: 100%;
            padding: 15px;
            font-size: 1.3rem;
            background: #1a1a3a;
            border: 2px solid #333366;
            color: #fff;
            border-radius: 8px;
            outline: none;
            box-sizing: border-box;
            transition: 0.3s;
        }

        .input-area:focus {
            border-color: var(--neon-pink);
            box-shadow: 0 0 10px rgba(254, 1, 154, 0.5);
        }

        .btn {
            background: linear-gradient(45deg, var(--neon-cyan), var(--neon-pink));
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            margin-top: 15px;
            width: 100%;
        }

        .btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <header>
        <h1>Neon Arena</h1>
        <div class="subtitle">Pro Esports Typing Speed Test</div>
    </header>

    <div class="container">
        <div class="stats-bar">
            <div class="stat-box">
                <div class="stat-val" id="wpm">0</div>
                <div class="stat-lbl">WPM (Speed)</div>
            </div>
            <div class="stat-box">
                <div class="stat-val" id="accuracy">100%</div>
                <div class="stat-lbl">Accuracy</div>
            </div>
            <div class="stat-box">
                <div class="stat-val" id="timer">60</div>
                <div class="stat-lbl">Time Left (s)</div>
            </div>
        </div>

        <div class="word-display" id="wordsScreen">
            Loading arena words...
        </div>

        <input type="text" class="input-area" id="typingInput" placeholder="Type the words here to start match..." disabled>
        
        <button class="btn" id="startBtn">Start Esports Match</button>
    </div>

    <script>
        // AAPKI LIVE BACKEND LINK
        const BACKEND_URL = "https://pro-esports-typing-arena.onrender.com";
        
        const wordsList = ["neon", "esports", "velocity", "clutch", "tournament", "frag", "quadra", "apex", "reflex", "hyper", "cyber", "glitch", "database", "server", "cluster", "matrix", "quantum", "vector"];
        
        let timer = 60;
        let score = 0;
        let isPlaying = false;
        let currentWordIndex = 0;
        let intervalId;

        const wordsScreen = document.getElementById('wordsScreen');
        const typingInput = document.getElementById('typingInput');
        const timerTxt = document.getElementById('timer');
        const wpmTxt = document.getElementById('wpm');
        const startBtn = document.getElementById('startBtn');

        function renderWords() {
            wordsScreen.innerHTML = wordsList.map((word, index) => {
                if(index === currentWordIndex) return `<span class="current-word">${word}</span>`;
                return `<span>${word}</span>`;
            }).join(' ');
        }

        startBtn.addEventListener('click', () => {
            if(isPlaying) return;
            isPlaying = true;
            timer = 60;
            score = 0;
            currentWordIndex = 0;
            typingInput.disabled = false;
            typingInput.value = '';
            typingInput.focus();
            wpmTxt.innerText = '0';
            timerTxt.innerText = timer;
            startBtn.innerText = "Match in Progress...";
            
            renderWords();
            
            intervalId = setInterval(() => {
                timer--;
                timerTxt.innerText = timer;
                if(timer <= 0) {
                    endGame();
                }
            }, 1000);
        });

        typingInput.addEventListener('input', () => {
            let currentWord = wordsList[currentWordIndex];
            let typedText = typingInput.value.trim();

            if(typedText === currentWord) {
                score++;
                currentWordIndex++;
                typingInput.value = '';
                
                let calculatedWpm = Math.round((score / (60 - timer)) * 60);
                wpmTxt.innerText = isFinite(calculatedWpm) ? calculatedWpm : score;

                if(currentWordIndex >= wordsList.length) {
                    currentWordIndex = 0; // Loop words
                }
                renderWords();
            }
        });

        function endGame() {
            clearInterval(intervalId);
            isPlaying = false;
            typingInput.disabled = true;
            startBtn.innerText = "Start Esports Match";
            alert(`Match Over! Your Final Speed: ${wpmTxt.innerText} WPM`);
            
            // SEND SCORE TO YOUR LIVE BACKEND
            fetch(`${BACKEND_URL}/api/scores`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ score: parseInt(wpmTxt.innerText) })
            })
            .then(res => console.log("Score saved to MongoDB!"))
            .catch(err => console.error("Error saving score:", err));
        }

        // Initial Load
        wordsScreen.innerHTML = "Click the button below to start the battle!";
    </script>
</body>
</html>

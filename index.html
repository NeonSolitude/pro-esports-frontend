<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Esports Typing Arena</title>
    <style>
        :root { --bg: #05050a; --panel: #0d0d1a; --cyan: #00f2fe; --pink: #fe019a; --text: #e2e2ff; }
        body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .box { width: 90%; max-width: 500px; background: var(--panel); border: 2px solid var(--cyan); border-radius: 12px; padding: 25px; margin-top: 40px; box-sizing: border-box; display: none; box-shadow: 0 0 15px rgba(0,242,254,0.2); }
        .active { display: block; }
        h2 { text-align: center; text-transform: uppercase; margin-top: 0; text-shadow: 0 0 10px var(--cyan); color: #fff; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #8a8aaf; font-size: 0.9rem; }
        input { width: 100%; padding: 12px; background: #14142c; border: 1px solid #333366; color: #fff; border-radius: 6px; box-sizing: border-box; outline: none; }
        input:focus { border-color: var(--pink); box-shadow: 0 0 8px rgba(254,1,154,0.4); }
        .btn { width: 100%; padding: 12px; background: linear-gradient(45deg, var(--cyan), var(--pink)); border: none; color: white; font-weight: bold; border-radius: 6px; cursor: pointer; text-transform: uppercase; margin-top: 10px; }
        .link { text-align: center; margin-top: 15px; color: var(--cyan); cursor: pointer; font-size: 0.9rem; }
        .nav { display: flex; justify-content: space-around; margin-top: 20px; background: #000; padding: 10px; width: 100%; position: fixed; bottom: 0; }
        .nav-item { color: #8a8aaf; cursor: pointer; font-weight: bold; font-size: 0.9rem; text-transform: uppercase; }
        .nav-item.active-nav { color: var(--cyan); text-shadow: 0 0 5px var(--cyan); }
        .word-box { background: #000; padding: 20px; border-radius: 6px; font-size: 1.3rem; text-align: center; margin-bottom: 15px; border: 1px solid #222244; letter-spacing: 1px; min-height: 40px; }
        .current-word { color: var(--pink); font-weight: bold; text-decoration: underline; }
    </style>
</head>
<body>

    <h1 style="text-align:center; color:#fff; text-shadow:0 0 15px var(--cyan); margin-top:20px; text-transform:uppercase; font-size:1.8rem;">Arena Matrix</h1>

    <div id="authBox" class="box active">
        <h2 id="authTitle">Gamer Login</h2>
        <div class="form-group" id="userGroup" style="display:none;">
            <label>Esports Gamer Tag</label>
            <input type="text" id="authUsername" placeholder="Unique name">
        </div>
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="authEmail" placeholder="Enter email">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="authPassword" placeholder="Enter security key">
        </div>
        <button class="btn" id="authSubmitBtn">Initialize Connection</button>
        <div class="link" id="authToggle">New Player? Create Account</div>
    </div>

    <div id="arenaBox" class="box">
        <h2>Typing Arena</h2>
        <div style="display:flex; justify-content:space-between; margin-bottom:15px; font-weight:bold; background:#000; padding:10px; border-radius:4px;">
            <div>WPM: <span id="liveWpm" style="color:var(--cyan)">0</span></div>
            <div>TIME: <span id="liveTimer" style="color:var(--pink)">60</span>s</div>
        </div>
        <div class="word-box" id="arenaWordDisplay">Click Start Match Below...</div>
        <input type="text" id="arenaInput" placeholder="Secure typing field..." disabled>
        <button class="btn" id="arenaStartBtn">Start Official Match</button>
    </div>

    <div id="walletBox" class="box">
        <h2>Esports Wallet</h2>
        <div style="text-align:center; margin-bottom:20px; background:#000; padding:15px; border-radius:6px; border:1px solid var(--cyan);">
            <div style="color:#8a8aaf; font-size:0.8rem; text-transform:uppercase;">Current Balance</div>
            <div style="font-size:2rem; font-weight:bold; color:#fff; margin-top:5px;"><span id="walletBal">0</span> <span style="font-size:1rem; color:var(--pink)">COINS</span></div>
        </div>
        <div class="form-group">
            <label>Amount (Coins)</label>
            <input type="number" id="walletAmount" placeholder="Enter coins">
        </div>
        <button class="btn" id="depositBtn" style="background:var(--cyan); color:#000;">Request Deposit</button>
        <button class="btn" id="withdrawBtn" style="background:transparent; border:1px solid var(--pink); color:var(--pink);">Request Withdrawal</button>
    </div>

    <div id="navigationBar" class="nav" style="display:none;">
        <div class="nav-item active-nav" id="navArena">Arena</div>
        <div class="nav-item" id="navWallet">Wallet</div>
        <div class="nav-item" id="navLogout">Logout</div>
    </div>

    <script>
        const BACKEND = "https://pro-esports-typing-arena.onrender.com";
        let token = "", isLogin = true, words = [], currentIdx = 0, score = 0, timer = 60, isPlaying = false, interval;
        const matchId = "MATCH_" + Math.floor(Math.random() * 100000);

        // UI Switches
        const showBox = (id) => { document.querySelectorAll('.box').forEach(b => b.classList.remove('active')); document.getElementById(id).classList.add('active'); };
        
        // Navigation Setup
        document.getElementById('navArena').addEventListener('click', () => { showBox('arenaBox'); setActiveNav('navArena'); });
        document.getElementById('navWallet').addEventListener('click', () => { showBox('walletBox'); setActiveNav('navWallet'); });
        document.getElementById('navLogout').addEventListener('click', () => { localStorage.clear(); location.reload(); });
        function setActiveNav(id) { document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active-nav')); document.getElementById(id).classList.add('active-nav'); }

        // Auth Form Toggle
        document.getElementById('authToggle').addEventListener('click', () => {
            isLogin = !isLogin;
            document.getElementById('authTitle').innerText = isLogin ? "Gamer Login" : "Register Account";
            document.getElementById('userGroup').style.display = isLogin ? "none" : "block";
            document.getElementById('authToggle').innerText = isLogin ? "New Player? Create Account" : "Already registered? Login here";
        });

        // AUTH OPERATION (HANDBOOK SECTION 3.A)
        document.getElementById('authSubmitBtn').addEventListener('click', async () => {
            const email = document.getElementById('authEmail').value.trim();
            const password = document.getElementById('authPassword').value.trim();
            const username = document.getElementById('authUsername').value.trim();

            const path = isLogin ? "/api/auth/login" : "/api/auth/register";
            const payload = isLogin ? { email, password } : { username, email, password };

            try {
                const res = await fetch(`${BACKEND}${path}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                const data = await res.json();
                if(!res.ok) throw new Error(data.message);

                token = data.token;
                document.getElementById('walletBal').innerText = data.user.wallet_balance;
                document.getElementById('navigationBar').style.display = "flex";
                showBox('arenaBox');
            } catch (err) { alert(err.message); }
        });

        // 🛡️ ANTI-CHEAT LOGIC GATEWAY (HANDBOOK SECTION 3.B)
        const triggerDisqualification = async (reason) => {
            if(!isPlaying) return;
            clearInterval(interval); isPlaying = false;
            document.getElementById('arenaInput').disabled = true;
            document.getElementById('arenaStartBtn').innerText = "DISQUALIFIED";
            alert(`🚨 DISQUALIFIED: ${reason}`);

            await fetch(`${BACKEND}/api/game/submit`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ matchId, wpm: 0, status: 'DISQUALIFIED', cheatReason: reason })
            });
        };

        // Window event hooks
        window.addEventListener('blur', () => triggerDisqualification('Tab Switch Detected'));
        document.addEventListener('visibilitychange', () => { if(document.hidden) triggerDisqualification('Background Minimization'); });
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => { if(e.ctrlKey && (e.key === 'c' || e.key === 'v')) { e.preventDefault(); triggerDisqualification('Copy-Paste Violation'); } });

        // GAMEPLAY CYCLE ENGINE
        function renderArenaWords() {
            document.getElementById('arenaWordDisplay').innerHTML = words.map((w, i) => i === currentIdx ? `<span class="current-word">${w}</span>` : `<span>${w}</span>`).join(' ');
        }

        document.getElementById('arenaStartBtn').addEventListener('click', async () => {
            if(isPlaying) return;
            
            // Server-side text fetch (Zero Leak)
            try {
                const res = await fetch(`${BACKEND}/api/game/paragraph`, { headers: { 'Authorization': `Bearer ${token}` } });
                const data = await res.json();
                words = data.text.split(' ');
            } catch { words = ["fallback", "matrix", "offline", "server"]; }

            isPlaying = true; timer = 60; score = 0; currentIdx = 0;
            document.getElementById('arenaInput').disabled = false;
            document.getElementById('arenaInput').value = '';
            document.getElementById('arenaInput').focus();
            document.getElementById('arenaStartBtn').innerText = "MATCH LIVE";
            renderArenaWords();

            interval = setInterval(() => {
                timer--;
                document.getElementById('liveTimer').innerText = timer;
                if(timer <= 0) endOfficialMatch();
            }, 1000);
        });

        document.getElementById('arenaInput').addEventListener('input', () => {
            let typed = document.getElementById('arenaInput').value.trim();
            if(typed === words[currentIdx]) {
                score++; currentIdx++;
                document.getElementById('arenaInput').value = '';
                let liveWpm = Math.round((score / (60 - timer)) * 60);
                document.getElementById('liveWpm').innerText = isFinite(liveWpm) ? liveWpm : score;
                if(currentIdx >= words.length) currentIdx = 0;
                renderArenaWords();
            }
        });

        async function endOfficialMatch() {
            clearInterval(interval); isPlaying = false;
            document.getElementById('arenaInput').disabled = true;
            document.getElementById('arenaStartBtn').innerText = "Start Official Match";
            const finalWpm = parseInt(document.getElementById('liveWpm').innerText);

            await fetch(`${BACKEND}/api/game/submit`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ matchId, wpm: finalWpm, status: 'QUALIFIED' })
            });
            alert(`Match Over! Speed logged: ${finalWpm} WPM.`);
        }

        // WALLET SYSTEM PROCESSES (HANDBOOK SECTION 3.C)
        const processTx = async (type) => {
            const amount = parseInt(document.getElementById('walletAmount').value);
            if(!amount || amount <= 0) return alert("Enter valid coin amount");

            try {
                const res = await fetch(`${BACKEND}/api/wallet/transaction`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ amount, type })
                });
                const data = await res.json();
                alert(data.message);
            } catch { alert("Wallet system synchronization error"); }
        };
        document.getElementById('depositBtn').addEventListener('click', () => processTx('deposit'));
        document.getElementById('withdrawBtn').addEventListener('click', () => processTx('withdrawal'));
    </script>
</body>
</html>
